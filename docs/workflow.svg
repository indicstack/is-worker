<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <title>/pwris workflow</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
  <rect width="820" height="700" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1b1b1b">/pwris: from prompt to table</text>
  <text x="410" y="48" text-anchor="middle" fill="#6b7076">Claude plans and judges · IndicStack Qwen types · scripts check</text>

  <!-- legend -->
  <rect x="40" y="62" width="12" height="12" fill="#eeedfe" stroke="#534ab7"/><text x="58" y="73" fill="#3c3489">Claude (your session)</text>
  <rect x="220" y="62" width="12" height="12" fill="#e1f5ee" stroke="#0f6e56"/><text x="238" y="73" fill="#085041">Scripts (no model)</text>
  <rect x="380" y="62" width="12" height="12" fill="#faece7" stroke="#993c1d"/><text x="398" y="73" fill="#712b13">IndicStack worker</text>
  <rect x="540" y="62" width="12" height="12" fill="#fbeaf0" stroke="#993556"/><text x="558" y="73" fill="#72243e">Fresh Claude (blind)</text>

  <!-- row 1 -->
  <g><rect x="40" y="100" width="170" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/><text x="125" y="123" text-anchor="middle" font-weight="600" fill="#3c3489">1. You type /pwris</text><text x="125" y="142" text-anchor="middle" fill="#534ab7">idea or PRD attached</text></g>
  <line x1="210" y1="128" x2="258" y2="128" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <g><rect x="262" y="100" width="170" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/><text x="347" y="123" text-anchor="middle" font-weight="600" fill="#085041">2. doctor</text><text x="347" y="142" text-anchor="middle" fill="#0f6e56">Node, claude, key, API</text></g>
  <line x1="432" y1="128" x2="480" y2="128" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <g><rect x="484" y="100" width="170" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/><text x="569" y="123" text-anchor="middle" font-weight="600" fill="#085041">READY?</text><text x="569" y="142" text-anchor="middle" fill="#0f6e56">no → key prompt, stop</text></g>
  <line x1="654" y1="128" x2="702" y2="128" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <g><rect x="706" y="100" width="90" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/><text x="751" y="123" text-anchor="middle" font-weight="600" fill="#2c2c2a">status</text><text x="751" y="142" text-anchor="middle" fill="#5f5e5a">resume?</text></g>

  <!-- row 2 (right to left connector) -->
  <path d="M751 156 L751 180 L125 180 L125 200" fill="none" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <g><rect x="40" y="204" width="170" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/><text x="125" y="227" text-anchor="middle" font-weight="600" fill="#3c3489">3. Questions (≤5)</text><text x="125" y="246" text-anchor="middle" fill="#534ab7">skipped if PRD answers</text></g>
  <line x1="210" y1="232" x2="258" y2="232" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <g><rect x="262" y="204" width="170" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/><text x="347" y="227" text-anchor="middle" font-weight="600" fill="#3c3489">4. Brief → frozen</text><text x="347" y="246" text-anchor="middle" fill="#534ab7">rules, constants, hash</text></g>
  <line x1="432" y1="232" x2="480" y2="232" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <g><rect x="484" y="204" width="170" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/><text x="569" y="227" text-anchor="middle" font-weight="600" fill="#3c3489">5. Tickets + tests</text><text x="569" y="246" text-anchor="middle" fill="#534ab7">tests before any code</text></g>
  <line x1="654" y1="232" x2="702" y2="232" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <g><rect x="706" y="204" width="90" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/><text x="751" y="227" text-anchor="middle" font-weight="600" fill="#2c2c2a">your go</text><text x="751" y="246" text-anchor="middle" fill="#5f5e5a">cost shown</text></g>

  <!-- row 3: the ticket loop -->
  <path d="M751 260 L751 284 L125 284 L125 304" fill="none" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="40" y="308" width="756" height="170" rx="12" fill="none" stroke="#b4b2a9" stroke-dasharray="4 3"/>
  <text x="56" y="328" fill="#5f5e5a" font-weight="600">6. For each ticket (worker.mjs)</text>
  <g><rect x="56" y="344" width="150" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/><text x="131" y="367" text-anchor="middle" font-weight="600" fill="#085041">Build prompt</text><text x="131" y="386" text-anchor="middle" fill="#0f6e56">brief + files + test</text></g>
  <line x1="206" y1="372" x2="244" y2="372" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <g><rect x="248" y="344" width="150" height="56" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/><text x="323" y="367" text-anchor="middle" font-weight="600" fill="#712b13">Qwen writes files</text><text x="323" y="386" text-anchor="middle" fill="#993c1d">JSON, thinking off</text></g>
  <line x1="398" y1="372" x2="436" y2="372" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <g><rect x="440" y="344" width="150" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/><text x="515" y="367" text-anchor="middle" font-weight="600" fill="#085041">check.mjs</text><text x="515" y="386" text-anchor="middle" fill="#0f6e56">paths, syntax, tests</text></g>
  <line x1="590" y1="372" x2="628" y2="372" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <g><rect x="632" y="344" width="150" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/><text x="707" y="367" text-anchor="middle" font-weight="600" fill="#085041">Regression</text><text x="707" y="386" text-anchor="middle" fill="#0f6e56">earlier tests re-run</text></g>
  <text x="56" y="428" fill="#5f5e5a">Fail → one retry with the error text → still failing → claude-queue (Claude writes that one ticket)</text>
  <text x="56" y="448" fill="#5f5e5a">API: length/empty → bigger budget · bad JSON/runaway → named fix · 5xx → 3 tries · 429 ×6 → breaker, resume later</text>
  <text x="56" y="468" fill="#5f5e5a">Every call logged to calls.jsonl (tokens, cost, time); budgets re-learned from this run for the next one</text>

  <!-- row 4 -->
  <path d="M418 478 L418 502" fill="none" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <g><rect x="40" y="506" width="170" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/><text x="125" y="529" text-anchor="middle" font-weight="600" fill="#085041">7. Review folder</text><text x="125" y="548" text-anchor="middle" fill="#0f6e56">brief + diff, leak-scanned</text></g>
  <line x1="210" y1="534" x2="258" y2="534" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <g><rect x="262" y="506" width="170" height="56" rx="8" fill="#fbeaf0" stroke="#993556" stroke-width="0.8"/><text x="347" y="529" text-anchor="middle" font-weight="600" fill="#72243e">8. Blind review</text><text x="347" y="548" text-anchor="middle" fill="#993556">fresh session, REVIEW.md</text></g>
  <line x1="432" y1="534" x2="480" y2="534" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <g><rect x="484" y="506" width="170" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/><text x="569" y="529" text-anchor="middle" font-weight="600" fill="#085041">9. table</text><text x="569" y="548" text-anchor="middle" fill="#0f6e56">tokens, ₹, tests, time</text></g>
  <line x1="654" y1="534" x2="702" y2="534" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <g><rect x="706" y="506" width="90" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/><text x="751" y="529" text-anchor="middle" font-weight="600" fill="#3c3489">10. Try it</text><text x="751" y="548" text-anchor="middle" fill="#534ab7">link or cmd</text></g>

  <path d="M751 562 L751 590 L125 590 L125 612" fill="none" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>
  <g><rect x="40" y="616" width="300" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/><text x="190" y="643" text-anchor="middle" fill="#2c2c2a">11. "next" → next milestone (back to step 5)</text></g>
  <text x="410" y="684" text-anchor="middle" fill="#6b7076">Per-project files: .pwr/BRIEF.md · tickets.jsonl · tests/ · runs/&lt;date&gt;/ (never overwritten) · state/</text>
</svg>
